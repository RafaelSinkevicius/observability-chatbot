<!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chatbot Observability</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f9;
                color: #333;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 400px;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .chat-window {
                border: 1px solid #ddd;
                border-radius: 5px;
                background: #f9f9f9;
                padding: 1rem;
                height: 300px;
                overflow-y: auto;
                font-size: 0.95rem;
            }
            .message {
                margin-bottom: 1rem;
            }
            .user-message {
                text-align: right;
                color: #4CAF50;
                font-weight: bold;
            }
            .bot-message {
                text-align: left;
                color: #555;
            }
            form {
                display: flex;
                gap: 0.5rem;
            }
            input[type="text"] {
                flex: 1;
                padding: 0.8rem;
                font-size: 1rem;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            button {
                padding: 0.8rem;
                font-size: 1rem;
                font-weight: bold;
                color: white;
                background: #4CAF50;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background 0.3s;
            }
            button:hover {
                background: #45a049;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Chatbot Observability</h1>
            <div class="chat-window" id="chatWindow"></div>
            <form id="chatForm">
                <input type="text" id="question" name="question" placeholder="Digite aqui..." required>
                <button type="submit">Enviar</button>
            </form>
        </div>
        <script>
            const form = document.getElementById('chatForm');
            const chatWindow = document.getElementById('chatWindow');

            form.addEventListener('submit', function(event) {
                event.preventDefault(); // Impede o envio tradicional do formulário
                const question = document.getElementById('question').value;

                // Adiciona a pergunta do usuário no chat
                const userMessage = document.createElement('div');
                userMessage.className = 'message user-message';
                userMessage.textContent = question;
                chatWindow.appendChild(userMessage);

                // Faz a requisição ao servidor
                fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question }),
                })
                .then(response => response.json())
                .then(data => {
                    // Adiciona a resposta do chatbot no chat
                    const botMessage = document.createElement('div');
                    botMessage.className = 'message bot-message';
                    botMessage.textContent = data.answer;
                    chatWindow.appendChild(botMessage);

                    // Rola automaticamente para o final do chat
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                })
                .catch(error => {
                    const botMessage = document.createElement('div');
                    botMessage.className = 'message bot-message';
                    botMessage.textContent = "Erro ao processar a pergunta. Tente novamente.";
                    chatWindow.appendChild(botMessage);

                    console.error('Erro:', error);
                });

                // Limpa o campo de entrada
                document.getElementById('question').value = '';
            });
        </script>
    </body>
    </html>
